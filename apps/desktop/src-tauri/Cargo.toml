[package]
name = "luminescent-desktop"
version = "0.0.1"
description = "The Luminescent Lakehouse desktop shell: Tauri commands and events over shell-core"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The library holds the app (so the bindings test can build its specta builder); the
# binary only calls `run()`.
name = "luminescent_desktop"
crate-type = ["rlib"]

[[bin]]
name = "luminescent-desktop"
path = "src/main.rs"

[features]
# hydrofoil's query engine, for the Query app and Catalog's table preview
# (docs/desktop.md, "Query"). Most of a build's time and target/ size: off by
# default, so work elsewhere skips it. Release builds, the smoke test and
# `just desktop-check` turn it on. Without it, `query_run` says the build has none.
query = ["dep:buffa", "dep:connectrpc", "dep:hydrofoil", "dep:olai-uc-object-store"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
buffa = { workspace = true, optional = true }
bytes = { workspace = true }
connectrpc = { workspace = true, optional = true }
futures = { workspace = true }
hydrofoil = { workspace = true, optional = true }
olai-uc-object-store = { workspace = true, optional = true }
olai-stack-runtime = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-core = { workspace = true, features = ["specta"] }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-specta = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
