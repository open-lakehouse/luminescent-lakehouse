<!doctype html>
<!--
  The MCP Apps sandbox proxy (ext-apps' double-iframe convention), served by the
  desktop's `mcp-app://` scheme with its CSP as a header (csp.txt). The shell frames
  it; it frames the View (sandbox.js). See docs/desktop.md, "MCP App sandbox".
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>MCP App sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
    </style>
    <script type="module" src="./sandbox.js"></script>
  </head>
  <body></body>
</html>
