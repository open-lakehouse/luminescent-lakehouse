<!doctype html>
<!--
  Served only to a `--smoke` run. No meta CSP: what holds here is the scheme's header.
  Reports to its parent what a frame on this scheme can reach (src/host/smoke.ts).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      (async () => {
        const violations = [];
        document.addEventListener("securitypolicyviolation", (e) => {
          violations.push({ directive: e.effectiveDirective, policy: e.originalPolicy });
        });
        const blocked = async (url) => {
          try {
            await fetch(url, { method: "POST", body: "{}" });
            return false;
          } catch {
            return true;
          }
        };
        const report = {
          tauriInternals: typeof window.__TAURI_INTERNALS__,
          ipc: typeof window.ipc,
          ipcSchemeBlocked: await blocked("ipc://localhost/plugin%3Aevent%7Clisten"),
          ipcHttpBlocked: await blocked("http://ipc.localhost/plugin%3Aevent%7Clisten"),
        };
        // Let the violation events land.
        await new Promise((r) => setTimeout(r, 50));
        report.violations = violations;
        window.parent.postMessage({ jsonrpc: "2.0", method: "smoke/probe", params: report }, "*");
      })();
    </script>
  </head>
  <body></body>
</html>
