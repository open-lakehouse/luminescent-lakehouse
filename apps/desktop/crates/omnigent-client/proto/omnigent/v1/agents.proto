syntax = "proto3";

package omnigent.v1;

import "google/api/annotations.proto";

// Installed agents (`omnigent/server/routes/agents.py`).
service AgentsService {
  rpc ListAgents(ListAgentsRequest) returns (AgentList) {
    option (google.api.http) = {get: "/v1/agents"};
  }
}

message ListAgentsRequest {
  optional int32 limit = 1;
  optional string after = 2;
  // `user`: the caller's own agents (`omnigent agent add`), which the default (the
  // server's agents) never lists.
  optional string scope = 3;
}

message AgentList {
  repeated Agent data = 1;
  optional string first_id = 2;
  optional string last_id = 3;
  bool has_more = 4;
}

// `AgentObject` (schemas.py).
message Agent {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string harness = 4;
  int64 created_at = 5;
  optional int64 updated_at = 6;
  int32 version = 7;
  bool builtin = 8;
}
