[package]
name = "shell-core"
version = "0.0.0"
description = "The desktop shell's logic, free of Tauri: toolchain doctor and the service proxy"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `specta::Type` on the DTOs the shell's commands return, for the generated bindings.
specta = ["dep:specta"]

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
olai-stack-runtime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
