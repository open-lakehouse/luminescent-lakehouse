[package]
name = "shell-core"
version = "0.0.0"
description = "The desktop shell's logic, free of Tauri: shared state, the planner, the toolchain doctor and the service proxy"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `specta::Type` on the DTOs the shell's commands return, for the generated bindings.
specta = ["dep:specta", "dep:specta-typescript"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
# The reference factory, served in-process (src/factory.rs).
factory-core = { workspace = true }
factory-server = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
olai-stack-runtime = { workspace = true }
olai-stack-state = { workspace = true }
olai-stack-topology = { workspace = true }
omnigent-client = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
thiserror = { workspace = true }
tower = { workspace = true }
# The agent sessions' waits and reconnects, the token endpoint's listener (the app runs
# on Tokio).
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
olai-stack-runtime = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
