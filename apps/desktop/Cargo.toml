# The desktop shell's own Cargo workspace (and lock), apart from the root one: the
# root builds Neon Function addons under a size gate, this builds a Tauri app.
[workspace]
resolver = "2"
members = ["crates/shell-core", "src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/luminescent-lakehouse"
rust-version = "1.95.0"

[workspace.dependencies]
# Omnigent's client lives in the root workspace (shared with the factory); its
# `workspace = true` fields resolve there.
omnigent-client = { path = "../../crates/omnigent-client" }
shell-core = { path = "crates/shell-core" }
# The agentic factory (docs/factory), from the root workspace too: the reference
# factory-server's router, which the shell serves in-process as `factory`. Its library
# only: no binary, no SQLite, no Omnigent driver, no reconciler.
factory-core = { path = "../../crates/factory-core" }
factory-server = { path = "../../crates/factory-server", default-features = false }
# The factory's MCP server, mounted at the in-process factory's /mcp for the Agent
# view's side channel (plan review as an MCP App).
workgraph-mcp = { path = "../../crates/workgraph-mcp" }
# The `authz` operations, to provision an environment's agents on its branch.
luminescent-authz-admin = { path = "../../crates/authz-admin" }

# trestle's environment runtime (WP1/WP2 of #14). Exact 0.x pins: these crates
# break between patch releases. Keep olai-stack-state and olai-stack-topology on
# the versions the olai-stack-runtime release depends on.
#
# olai-stack-state 0.0.14 migrates state.db to schema 3 on open, one way: older
# desktops and `trestle` before 0.0.38 refuse the file afterwards.
#
# A fresh release sits behind the local crates.io proxy for 7 days (CI resolves
# from crates.io directly): build locally under trestle's crates-proxy patch and
# restore the lock with its lock-registry.sh before committing (docs/desktop.md).
olai-stack-runtime = { version = "=0.0.16", features = ["keychain", "neon"] }
olai-stack-state = "=0.0.15"
olai-stack-topology = { version = "=0.0.25", features = ["std-io", "catalog"] }

# hydrofoil's DataFusion query engine (Unity Catalog + Delta), embedded in the host
# for the Query app (docs/desktop.md, "Query"). Unpublished: pinned by rev, a full
# SHA on hydrofoil's main. Its other open-lakehouse deps come from crates.io; its
# one git pin, the roeap/delta-rs fork (deltalake-core), comes into this lock.
hydrofoil = { git = "https://github.com/open-lakehouse/hydrofoil", rev = "03d8fdd5763d0a9262e517f682e9698c71c2a62f" }
# What the host calls hydrofoil's engine with: its ConnectRPC router in-process, the
# proto runtime of its messages, and the Unity Catalog factory it reads through. On
# the versions hydrofoil's pin uses.
buffa = "0.7"
# Also the proto runtime of omnigent-client's generated models.
buffa-types = "0.7"
connectrpc = "0.7"
olai-uc-object-store = "0.0.9"

async-trait = "0.1"
# The token endpoint's listener (shell-core/src/token_endpoint.rs): HTTP/1 on Tokio.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
# RFC 3339 expiries from `databricks auth token`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
# The OS CSPRNG, for keys the app mints (the Unity Catalog KEK).
getrandom = "0.3"
# The native folder picker, called from Rust so the webview needs no dialog capability.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
# `unstable`: child webviews (`Window::add_child`), for the embedded service UIs.
tauri = { version = "2.12", features = ["unstable"] }
tauri-build = { version = "2.7", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", default-features = false }
# `ServiceExt::oneshot`: an in-process service's router, called by the proxy.
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
url = "2"

# Same as the root workspace: line tables for our crates, no debug info for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
