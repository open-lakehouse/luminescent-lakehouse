# The desktop shell's own Cargo workspace (and lock), apart from the root one: the
# root builds Neon Function addons under a size gate, this builds a Tauri app.
[workspace]
resolver = "2"
members = ["crates/shell-core", "src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/luminescent-lakehouse"
rust-version = "1.95.0"

[workspace.dependencies]
shell-core = { path = "crates/shell-core" }

# trestle's environment runtime (WP1/WP2 of #14). Exact 0.x pins: these crates
# break between patch releases. Keep olai-stack-state and olai-stack-topology on
# the versions the olai-stack-runtime release depends on.
#
# A fresh release sits behind the local crates.io proxy for 7 days (CI resolves
# from crates.io directly): build locally under trestle's crates-proxy patch and
# restore the lock with its lock-registry.sh before committing (docs/desktop.md).
olai-stack-runtime = { version = "=0.0.10", features = ["keychain", "neon"] }
olai-stack-state = "=0.0.9"
olai-stack-topology = { version = "=0.0.19", features = ["std-io", "catalog"] }

base64 = "0.22"
bytes = "1"
futures = "0.3"
# The OS CSPRNG, for keys the app mints (the Unity Catalog KEK).
getrandom = "0.3"
# The native folder picker, called from Rust so the webview needs no dialog capability.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
# `unstable`: child webviews (`Window::add_child`), for the embedded service UIs.
tauri = { version = "2.12", features = ["unstable"] }
tauri-build = { version = "2.7", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", default-features = false }
tracing = "0.1"

# Same as the root workspace: line tables for our crates, no debug info for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
