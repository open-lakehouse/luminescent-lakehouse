name: web

# The Neon Auth web app (apps/web): lint, typecheck, unit tests, the
# production build Vercel runs and the self-hosting tarball. Vercel deploys it;
# this only gates the PR. Also the deploy tooling's tests (neon.ts, scripts/),
# which share its setup.

on:
  merge_group:
  push:
    branches: [main]
    paths: &paths
      - apps/web/**
      - neon.ts
      - scripts/**
      - package.json
      - bun.lock
      - bunfig.toml
      - justfile
      - .github/workflows/web.yml
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: check (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # bun.lock must ship without local registry proxy URLs (see AGENTS.md);
      # fail rather than rewrite it, which would defeat --frozen-lockfile.
      - name: Install
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile --ignore-scripts

      - name: Lint, typecheck, test
        run: just web-check

      - name: Build
        run: just web-build

      - name: Self-hosting tarball
        run: just web-bundle

      - name: Deploy tooling tests
        run: just tooling-test
