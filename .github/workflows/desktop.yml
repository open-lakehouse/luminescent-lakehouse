name: desktop

# The desktop shell (apps/desktop, docs/desktop.md): its own Cargo workspace
# and the UI. Linux checks everything (lint, types, tests, clippy, the
# generated bindings), runs the in-app smoke test under Xvfb, and runs it again
# on Docker: two revisions side by side, a relaunch that reconciles, no
# leftovers. macOS builds the unsigned .app, smoke-tests that bundle, and
# uploads it.

on:
  merge_group:
  push:
    branches: [main]
    paths: &paths
      - apps/desktop/**
      - package.json
      - bun.lock
      - bunfig.toml
      - justfile
      - rust-toolchain.toml
      - scripts/strip-bun-lock-proxy.ts
      - .github/workflows/desktop.yml
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: check (desktop, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # The headwaters image on ghcr.io, for the Docker smoke's lineage checks.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri's Linux webview (WebKitGTK 4.1) and Xvfb for the smoke test.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev xvfb

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
          env-vars: ImageOS
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # bun.lock must ship without local registry proxy URLs (see AGENTS.md),
      # and Cargo.lock without anything resolved under a local [patch].
      - name: Install
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          if grep -q '^\[\[patch.unused\]\]' apps/desktop/Cargo.lock; then
            echo "apps/desktop/Cargo.lock was resolved under a local [patch]" >&2; exit 1
          fi
          bun install --frozen-lockfile --ignore-scripts

      # mangrove's and headwaters' UI packages, from source at the commits
      # apps/desktop/siblings.json pins (sibling-uis.ts).
      - name: Service UIs
        run: bun run --cwd apps/desktop siblings

      - name: Lint, typecheck, test, clippy, bindings
        run: just desktop-check

      - name: Playwright WebKit
        working-directory: apps/desktop
        run: bunx playwright install --with-deps webkit

      - name: Smoke test and e2e
        run: just desktop-e2e

      # headwaters' image is on ghcr.io. Without access to it (a fork's PR, or the
      # package not shared with this repository) the Docker smoke runs without its
      # lineage checks, and says so. Keep the tag in step with trestle's
      # `images::HEADWATERS` (the default the module plans with).
      - name: Docker images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          if echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 &&
             docker pull -q ghcr.io/open-lakehouse/headwaters:0.0.7 >/dev/null; then
            echo "lineage=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=desktop docker smoke::can't pull ghcr.io/open-lakehouse/headwaters:0.0.7; the Lineage checks are skipped"
            echo "lineage=0" >> "$GITHUB_OUTPUT"
          fi

      # The same debug build as the smoke test above (scripts/smoke.sh), on the
      # runner's Docker: see docs/desktop.md (Running environments). With MLflow,
      # for the embedded service UI (a child webview) on Linux's webkit2gtk.
      - name: Docker smoke (two revisions side by side, relaunch, no leftovers)
        env:
          LUMINESCENT_SMOKE_DOCKER: "1"
          LUMINESCENT_SMOKE_LINEAGE: ${{ steps.images.outputs.lineage }}
          LUMINESCENT_SMOKE_UIS: "1"
        run: just desktop-smoke

      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          for p in $(docker compose ls -aq); do docker compose -p "$p" logs --tail 80 || true; done

  macos:
    name: build (desktop, macos)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
          env-vars: ImageOS
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # mangrove's and headwaters' UI packages, from source at the commits
      # apps/desktop/siblings.json pins (sibling-uis.ts).
      - name: Service UIs
        run: bun run --cwd apps/desktop siblings

      - name: Build the .app (unsigned)
        run: |
          start=$(date +%s)
          just desktop-build
          echo "::notice title=desktop build::tauri build took $(( $(date +%s) - start ))s"

      - name: Playwright WebKit
        working-directory: apps/desktop
        run: bunx playwright install webkit

      # The bundle itself, in the real WKWebView: IPC, CSP, the proxy.
      - name: Smoke test and e2e
        run: just desktop-e2e "apps/desktop/target/release/bundle/macos/Luminescent Lakehouse.app/Contents/MacOS/luminescent-desktop"

      - name: Zip the .app
        working-directory: apps/desktop/target/release/bundle/macos
        run: ditto -c -k --keepParent "Luminescent Lakehouse.app" luminescent-lakehouse-macos.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luminescent-lakehouse-macos
          path: apps/desktop/target/release/bundle/macos/luminescent-lakehouse-macos.zip
          retention-days: 14
