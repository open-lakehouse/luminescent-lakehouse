name: PR Title

# Enforce conventional-commit PR titles so the squash-merge commit stays
# machine-parseable. Use a `(scope)` naming the affected crate's directory
# (headwaters-neon, opensharing-neon, unitycatalog-neon, migrate) or app (web,
# desktop), or none for the shared harness.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
