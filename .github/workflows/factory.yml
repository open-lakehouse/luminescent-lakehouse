name: factory

# The agentic factory's control room (docs/factory): its protos (buf lint and
# build), packages/factory-client, packages/factory-ui, packages/factory-plan-review
# and apps/factory (Biome, typecheck, bun test, the app's build), and that
# workgraph-mcp's committed plan review view matches its build, and packs the
# release tarballs of factory-client and factory-ui as a dry run of
# factory-release.yml. The crates' tests run in ci.yml.

on:
  merge_group:
  push:
    branches: [main]
    paths: &paths
      - packages/**
      - apps/factory/**
      - crates/factory-proto/proto/**
      - crates/factory-proto/buf.yaml
      - crates/workgraph-mcp/assets/**
      - package.json
      - bun.lock
      - bunfig.toml
      - justfile
      - .github/workflows/factory.yml
      - .github/workflows/factory-release.yml
      - release-plz-factory.toml
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: check (factory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # `just factory-check` lints and builds the protos with buf.
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          # Resolving the buf release is a GitHub API call; unauthenticated, it
          # shares the runner IP's rate limit and fails intermittently.
          github_token: ${{ github.token }}

      # bun.lock must ship without local registry proxy URLs (see AGENTS.md);
      # fail rather than rewrite it, which would defeat --frozen-lockfile.
      - name: Install
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile --ignore-scripts

      - name: Lint, typecheck, test, build
        run: just factory-check

      # What a `factory-v<version>` release would carry (docs/factory/packages.md).
      - name: Pack the release tarballs
        run: just factory-pack
