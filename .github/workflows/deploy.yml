name: deploy

# Every commit on main goes to staging: a long-lived Neon branch off production
# (created on the first run). Once it staged, release-plz (release-plz.toml)
# tags a release if the commit carries an untagged version, which is what
# merging its release PR does, and the release is promoted to production behind
# the `production` environment's approval, while the release gets its assets
# (the bundles that staged, the CLI, the web tarball, manifest.json). Then
# release-plz opens or updates the release PR with the commits since.
# docs/deployment.md has the flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  staging:
    name: staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/neon-deploy.yml
    permissions:
      contents: read
    with:
      neon-branch: staging
      environment: staging
    secrets:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  # Only a commit that staged cleanly is tagged. A no-op unless the commit's
  # version (the root Cargo.toml) has no `v<version>` tag yet.
  release:
    name: release
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the GitHub Release
    # One release at a time, never cancelled halfway.
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-plz reads the tags and the history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"

      - name: Tag and release
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `releases` lists what this run released ([] or empty when nothing).
      - name: Released tag
        id: released
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '[.[]? | select(.package_name == "luminescent-lakehouse")][0].tag // empty' <<< "${RELEASES:-[]}")"
          if [ -n "$tag" ]; then
            echo "::notice title=release::released $tag; promoting it to production"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The same workflow a manual promotion or rollback runs, so the staged check
  # and the `production` environment's required approval apply unchanged.
  production:
    name: production
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/production.yml
    permissions:
      contents: read
      deployments: read
    with:
      sha: ${{ github.sha }}
    secrets:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  # The release's CLI (`just cli-archive`): luminescent-migrate and
  # luminescent-admin, built from the released commit, for each target.
  cli:
    name: cli (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}

      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: ${{ runner.os == 'Linux' && 'just,cargo-zigbuild' || 'just' }}

      - name: Build
        run: just cli-archive "${TAG#v}" "$TARGET"
        env:
          TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: target/release-assets/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  # Attaches what a deployer needs to the release (docs/deployment.md,
  # "Release assets"): the bundles that staged in this run, the CLI, the web
  # tarball, manifest.json and SHA256SUMS, each with a build provenance
  # attestation (`gh attestation verify <file> --repo <this repository>`).
  assets:
    name: release assets
    needs: [release, cli]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload to the GitHub Release
      id-token: write # OIDC for the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # bun.lock must ship without local registry proxy URLs (see AGENTS.md).
      - name: Install
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-staging-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: target/release-assets
          merge-multiple: true

      - name: Assemble
        run: |
          for t in dist-*.tar; do tar -xf "$t"; done
          just release-assets "${TAG#v}"
        env:
          TAG: ${{ needs.release.outputs.tag }}

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/release-assets/*

      - name: Upload
        run: gh release upload "$TAG" target/release-assets/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}

  # After `release`, so the PR never proposes the version just tagged. Opened
  # with GITHUB_TOKEN, as in the other repositories: GitHub runs no workflows on
  # a PR that token opens, so the release PR shows no checks. None are required,
  # and the merge is a normal push that runs this workflow. To run CI on it
  # anyway, push an empty commit to its branch.
  release-pr:
    name: release PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release-plz-* branch
      pull-requests: write # the release PR
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"

      - name: Open or update the release PR
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
