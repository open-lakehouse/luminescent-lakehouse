name: preview

# A Neon branch per pull request, `preview/pr-<n>` off staging, running the PR's
# functions against its own copy of staging's data. Same-repo PRs only: fork
# PRs get no secrets, and this never runs with pull_request_target. The branch
# is deleted when the PR closes; neon.ts gives it a 7 day TTL as a backstop.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions: {}

# One run per PR at a time, queued rather than cancelled (a deploy is never
# stopped halfway through a migration). Otherwise a push's deploy that is still
# running when the PR closes recreates the branch after cleanup deletes it,
# which is what merging a gh stack does (it pushes, then merges). GitHub keeps
# only the newest waiting run, so the close always runs, and runs last.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/neon-deploy.yml
    permissions:
      contents: read
    with:
      neon-branch: preview/pr-${{ github.event.number }}
      parent: staging
      environment: preview
    secrets:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  # OAuth sign-in through the production web app's pages for this preview, with
  # a throwaway email/password user it deletes again (docs/web.md).
  e2e:
    name: e2e
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      E2E_NEON_BRANCH: preview/pr-${{ github.event.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # bun.lock must ship without local registry proxy URLs (see AGENTS.md);
      # fail rather than rewrite it, which would defeat --frozen-lockfile.
      - name: Install
        working-directory: .
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end test
        run: bun run e2e

      # The test deletes its user itself; this covers a run that died first.
      - name: Delete the test user
        if: always()
        run: |
          [ -f test-results/e2e-user.json ] || { echo "→ no test user recorded"; exit 0; }
          id=$(jq -er .id test-results/e2e-user.json)
          if bunx neon neon-auth user delete "$id" --branch "$E2E_NEON_BRANCH" --project-id "$NEON_PROJECT_ID"; then
            echo "→ deleted test user $id"
          else
            echo "→ test user $id is already gone"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  cleanup:
    name: cleanup
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # bun.lock must ship without local registry proxy URLs (see AGENTS.md);
      # fail rather than rewrite it, which would defeat --frozen-lockfile.
      - name: Install the deploy tooling
        run: |
          bun run scripts/strip-bun-lock-proxy.ts --check
          bun install --frozen-lockfile --ignore-scripts

      - name: Delete the preview branch
        run: |
          if bunx neon branches get "$BRANCH" --project-id "$NEON_PROJECT_ID" >/dev/null 2>&1; then
            bunx neon branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID"
          else
            echo "→ $BRANCH is already gone"
          fi
        env:
          BRANCH: preview/pr-${{ github.event.number }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
