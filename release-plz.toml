# release-plz (https://release-plz.dev, not Google's release-please): releases
# of the deployed environments. On every push to main, deploy.yml opens or
# updates one release PR that bumps `luminescent-lakehouse` (the placeholder
# package in the root Cargo.toml) and its CHANGELOG.md from the conventional
# commits since the last release. Merging that PR makes deploy.yml stage the
# commit, tag `v<version>`, create the GitHub Release and promote the commit to
# production behind the `production` environment's approval
# (docs/deployment.md).
#
# Nothing here is published to crates.io. The desktop app is released on its
# own, from release-plz-desktop.toml (docs/desktop-release.md); a package added
# to the workspace needs an entry in both files.
#
# Config reference: https://release-plz.dev/docs/config

[workspace]
changelog_update = true
# No `cargo update` in the release PR: the pins move in their own PRs.
dependencies_update = false
semver_check = false
publish = false
# `git_only` (versions from tags, not a registry) is set per package, on the
# placeholder and the crates its `changelog_include` names: release-plz walks
# every `git_only` package's history, a `release = false` one too, and rebuilds
# the workspace at its newest tag, which fails for a crate added since. The
# others are `publish = false`, so release-plz leaves them alone.
# Only the placeholder is released, so the tag needs no package prefix.
git_tag_enable = false
git_release_enable = false
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]

[[package]]
name = "luminescent-lakehouse"
release = true
# Versions come from the tags, not a registry.
git_only = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
git_release_body = "{{ changelog }}"
# GitHub's "latest" release is kept for the desktop app, whose updater reads
# `releases/latest` (docs/desktop-release.md).
git_release_latest = false
changelog_path = "CHANGELOG.md"
# The crates are nested packages, so their files aren't the placeholder's:
# their commits release it through here.
changelog_include = [
  "headwaters-neon",
  "opensharing-neon",
  "unitycatalog-neon",
  "authz-neon",
  "workgraph-neon",
  "luminescent-migrate",
  # What the `workgraph` function builds of the factory.
  "plan-tree",
  "factory-proto",
  "factory-core",
  "workgraph-mcp",
]

# Every workspace crate needs an entry: release-plz releases any package it
# doesn't know, and one more package leaves `{{ version }}` in `pr_name`
# undefined, which fails the release PR job.
[[package]]
name = "headwaters-neon"
release = false
git_only = true

[[package]]
name = "opensharing-neon"
release = false
git_only = true

[[package]]
name = "unitycatalog-neon"
release = false
git_only = true

[[package]]
name = "authz-neon"
release = false
git_only = true

# Not `git_only` until a release tag contains the crate (v0.0.5 doesn't):
# release-plz would rebuild the workspace at that tag and not find it. Add
# `git_only = true` once the next `v*` release is out, like the others.
[[package]]
name = "workgraph-neon"
release = false

[[package]]
name = "luminescent-migrate"
release = false
git_only = true

# Omnigent's client, shared by the desktop and the factory. Nothing deployed
# builds it, so it isn't in the placeholder's `changelog_include`.
[[package]]
name = "omnigent-client"
release = false

# The agentic factory (docs/factory): unreleased for now; its consumers pin
# this repository by git rev. The `workgraph` function builds plan-tree,
# factory-proto, factory-core and workgraph-mcp, so they're in the
# placeholder's `changelog_include`; factory-server isn't deployed.
[[package]]
name = "plan-tree"
release = false

[[package]]
name = "factory-proto"
release = false

[[package]]
name = "factory-core"
release = false

[[package]]
name = "factory-server"
release = false

[[package]]
name = "workgraph-mcp"
release = false

# The desktop app's release placeholder (crates/desktop-release), released by
# release-plz-desktop.toml.
[[package]]
name = "luminescent-desktop-release"
release = false

[changelog]
protect_breaking_commits = true
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc",      group = "Documentation" },
  { message = "^build",    group = "Build" },
  { message = "^test",     skip = true },
  { message = "^chore",    skip = true },
  { message = "^ci",       skip = true },
]
