[package]
name = "factory-core"
description = "The factory's work graph: schema, validation, derived conditions, Merkle revisions, and the olai-store backend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true, features = ["json"] }
# Merges the extensions' descriptor sets for GetSchema.
buffa-descriptor = { workspace = true, features = ["reflect"] }
chrono.workspace = true
factory-proto.workspace = true
olai-store.workspace = true
plan-tree.workspace = true
serde.workspace = true
# Only to open a SQLite pool for olai-store's SqlStore.
sqlx = { version = "0.8", optional = true, default-features = false, features = ["sqlite", "runtime-tokio"] }
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
# The backend conformance suite, for other crates' tests.
testing = []
# The olai-store SQLite backend (`SqlStore`), the standalone server's default.
sqlite = ["olai-store/sqlite", "dep:sqlx"]
# The olai-store Postgres backend (`PgStore`).
postgres = ["olai-store/postgres"]
