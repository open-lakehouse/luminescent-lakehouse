[package]
name = "factory-core"
description = "The factory's work graph: schema, validation, derived conditions, Merkle revisions, and the olai-store backend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true, features = ["json"] }
# Merges the extensions' descriptor sets for GetSchema.
buffa-descriptor = { workspace = true, features = ["reflect"] }
chrono.workspace = true
factory-proto.workspace = true
futures.workspace = true
# The Omnigent adapter (`driver::omnigent`), with feature `omnigent`.
omnigent-client = { workspace = true, optional = true }
# The Omnigent adapter, the GitHub code host (`codehost::github`) and the
# Lakebase token endpoint (`pg::LakebaseCredentials`).
reqwest = { workspace = true, optional = true }
olai-store.workspace = true
# `databricks::DatabricksOAuth`, over trestle's Databricks unified auth.
olai-http = { workspace = true, optional = true }
# A GitHub App's JWT (RS256) and its PEM key, with feature `github`.
ring = { version = "0.17", optional = true }
base64 = { workspace = true, optional = true }
plan-tree.workspace = true
serde.workspace = true
# Only to open a pool for olai-store's SqlStore (SQLite) and to check
# PgStore's schema (Postgres); each feature adds its driver.
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "migrate"] }
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# The Omnigent server's root, with feature `omnigent`.
url = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
# A throwaway RSA key for the GitHub App's tests (ring can't generate one).
rand = "0.8"
rsa = "0.9"
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[features]
default = []
# The backend conformance suite, for other crates' tests.
testing = []
# The Omnigent driver over omnigent-client.
omnigent = ["dep:omnigent-client", "dep:reqwest", "dep:url"]
# The GitHub code host (GraphQL; the gh CLI's token, a given one, or a GitHub
# App's installation tokens, signed with ring, which rustls already builds).
github = ["dep:reqwest", "reqwest/json", "tokio/process", "tokio/time", "dep:ring", "dep:base64"]
# The olai-store SQLite backend (`SqlStore`), the standalone server's default.
sqlite = ["olai-store/sqlite", "dep:sqlx", "sqlx/sqlite"]
# The olai-store Postgres backend (`PgStore`) and `pg`'s connection helpers,
# over a schema applied first (`pg::migrate`) and checked at startup
# (`olai::postgres_check`). Over TLS with webpki's roots (Neon and Lakebase
# require TLS), as the other crates already build sqlx.
# The change feed's listener and poller (`feed::listen`, `feed::poll`) run as
# tasks of their own.
postgres = ["olai-store/postgres", "dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls", "tokio/rt", "tokio/time"]
# `databricks::DatabricksOAuth`: a Databricks service principal's OAuth token
# (client credentials), cached and renewed before it expires, by olai-http;
# and the workspace's SCIM groups.
databricks = ["dep:olai-http", "dep:reqwest", "reqwest/json", "tokio/time"]
# `pg::LakebaseCredentials`: a Databricks service principal's OAuth token as the
# Postgres password, renewed by a task while the pool is open.
lakebase = ["postgres", "databricks", "tokio/rt", "tokio/macros"]
