[package]
name = "luminescent-authz-admin"
version = "0.0.0"
description = "The operations on a branch's `authz` data: service accounts, API keys, groups and grants"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Kept to what the operations need, so the desktop links it without the
# services `luminescent-migrate` migrates.
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hex = "0.4"
sha2 = "0.10"
# sqlx's runtime and TLS backend are the host's.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "chrono", "uuid"] }
subtle = "2"
uuid = "1"
