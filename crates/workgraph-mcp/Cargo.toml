[package]
name = "workgraph-mcp"
description = "The factory's MCP server for agents: the work graph over Streamable HTTP, with per-session bearer tokens"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum.workspace = true
# The plan review snapshot: factory.v1 messages, binary, for the View.
base64.workspace = true
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true, features = ["json"] }
factory-core.workspace = true
factory-proto.workspace = true
# Token bytes.
getrandom = "0.3"
hex.workspace = true
plan-tree.workspace = true
# The official Rust MCP SDK, server role. Tool input schemas are written by
# hand, so no macros. The same line as mangrove's `uc mcp serve`.
rmcp = { version = "3.9", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
factory-core = { workspace = true, features = ["testing"] }
reqwest.workspace = true
rmcp = { version = "3.9", default-features = false, features = [
  "client",
  "server",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }

[features]
default = []
# `serve_stdio`: one client over stdin/stdout, with a grant fixed for the process.
stdio = ["rmcp/transport-io"]
