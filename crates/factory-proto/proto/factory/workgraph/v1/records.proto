// Records kept next to the graph: annotations on nodes, and runs that execute
// them. Neither is part of a node, and neither is hashed.
syntax = "proto3";

package factory.workgraph.v1;

import "factory/workgraph/v1/execution.proto";
import "factory/workgraph/v1/graph.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// An append-only note on a node.
message Annotation {
  string ref = 1;
  // The node it's attached to.
  string node = 2;
  // The type URL of `payload` (`Learning`, `ReconcileNote`, `DecisionOutcome`).
  string kind = 3;
  google.protobuf.Any payload = 4;
  Provenance provenance = 5;
  google.protobuf.Timestamp created_at = 6;
}

// One lesson, with the evidence it came from.
message Learning {
  string lesson = 1;
  // Links: a PR, a review thread, a trace.
  repeated string evidence = 2;
}

message ReconcileNote {
  // Markdown.
  string text = 1;
}

// A reviewer's verdict on a run's PRs: an annotation on the run's node,
// written by the review session (through the work-graph MCP). `task.v1`
// leaves `in_review` on it.
message ReviewVerdict {
  // The run reviewed.
  string run = 1;
  // The review step it answers.
  uint32 step = 2;
  bool pass = 3;
  // Markdown: what to fix, sent to the implementing session.
  string findings = 4;
}

message DecisionOutcome {
  string option = 1;
  string rationale = 2;
}

// The run lifecycle, after A2A and MCP tasks.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_WORKING = 2;
  // Waiting on a person (an ASK).
  RUN_STATE_INPUT_REQUIRED = 3;
  RUN_STATE_COMPLETED = 4;
  RUN_STATE_FAILED = 5;
  RUN_STATE_CANCELED = 6;
}

// One attempt at executing a node. The dispatch idempotency key is
// `(node, attempt)`. Its steps and artifacts are kept inline: runs are small.
message Run {
  string ref = 1;
  string node = 2;
  uint32 attempt = 3;
  RunState state = 4;
  // The Omnigent session of the current step, for quick display; the steps
  // hold every session.
  string session_id = 5;
  google.protobuf.Timestamp lease_expiry = 6;
  string prompt_name = 7;
  string prompt_version = 8;
  string trace_id = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // The executor driving it (`task.v1`, `plan.v1`, `gate.v1`).
  string executor = 12;
  // An executor-defined label for display (`implementing`, `in_review`,
  // `fixing`, `awaiting_merge`).
  string stage = 13;
  // The approved revision it was dispatched against.
  string revision = 14;
  repeated Step steps = 15;
  repeated Artifact artifacts = 16;
  // The sum over its steps.
  double cost_usd = 17;
  // The reconciler holding the lease (until `lease_expiry`).
  string lease_holder = 18;
  // The environment this run's sessions run in, when `StartRun` chose one;
  // empty for the submission's placement.
  string environment = 19;
  // The profile its executor session uses, when `StartRun` overrode the
  // node's.
  string profile = 20;
  // Why the run failed, when it did.
  string error = 21;
  // State its executor keeps across passes (`PlannerReports` for
  // `plan.v1`). The reconciler stores it and never reads it.
  google.protobuf.Any executor_state = 22;
  // Set while the run waits for a place in an environment whose every place
  // is taken (`Environment.max_sessions`); cleared when its session starts.
  PlaceWait waiting = 23;
}

// A run waiting for a place in a capped environment. Waiting runs get places
// in the order they started waiting.
message PlaceWait {
  string environment = 1;
  google.protobuf.Timestamp since = 2;
}

// What a planning run (`plan.v1`) has reported to its planner session: the
// stage events it acknowledged, and the report in flight. A report counts as
// delivered once the session has started the turn it was sent for.
message PlannerReports {
  // The event keys reported and acknowledged.
  repeated string reported = 1;
  // The event keys of the report in flight.
  repeated string pending = 2;
  // The `plan` step the report in flight went to.
  uint32 step = 3;
  // The turn of that step's session the report starts: 0 for a new
  // session's first turn, else the follow-up's number.
  uint32 turn = 4;
  google.protobuf.Timestamp sent_at = 5;
}
