[package]
name = "unitycatalog-neon"
version = "0.0.0"
description = "The Unity Catalog server as a Node-API addon, for deployment as a Neon Function"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# A deployment artifact (a `.node` inside a Neon Function zip), not a library:
# never published, never released.
publish = false

[lib]
crate-type = ["cdylib"]
# The `napi_*` symbols only resolve once Node loads the addon, so a Rust test
# binary cannot link; it is tested end to end with `node --test` instead
# (`just test unitycatalog`).
test = false
doctest = false

[dependencies]
# The socket-less server (`embed`) on Postgres with verified callers
# (`olai-auth`: Neon Auth JWTs and `authz` API keys), and no other surface: no
# UI, Swagger, storage proxy or Files API.
#
# `neon-trusted-vending`: the catalog vends branch-wide, expiring Neon storage
# keys for `aws_iam_role` credentials with a Neon ARN, but only where
# `vending.neon.enabled` (per branch, neon.ts) and behind olai-auth and the
# Cedar PDP, which the server checks at startup. A vended key reaches every
# bucket on the branch (docs/auth.md, "Credential vending on Neon").
unitycatalog-server = { workspace = true, features = ["embed", "postgres", "olai-auth", "neon-trusted-vending"] }

axum = { workspace = true }
http-body-util = "0.1"
# `async` runs `#[napi] async fn`s on napi's own tokio runtime.
napi = { version = "3.5", default-features = false, features = ["napi9", "async"] }
napi-derive = "3.5"
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5"

[build-dependencies]
napi-build = "2.1"
