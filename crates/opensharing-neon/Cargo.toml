[package]
name = "opensharing-neon"
version = "0.0.0"
description = "The OpenSharing server as a Node-API addon, for deployment as a Neon Function"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# A deployment artifact (a `.node` inside a Neon Function zip), not a library:
# never published, never released.
publish = false

[lib]
crate-type = ["cdylib"]
# The `napi_*` symbols only resolve once Node loads the addon, so a Rust test
# binary cannot link; it is tested end to end with `node --test` instead
# (`just test opensharing`).
test = false
doctest = false

[dependencies]
# The Unity Catalog source and admin API are part of the deployed function.
opensharing-server = { workspace = true, features = ["unity"] }

# Must be the axum major that opensharing-server builds its router with
# (aligning: #2).
axum = "0.8"
http-body-util = "0.1"
# `async` runs `#[napi] async fn`s on napi's own tokio runtime.
napi = { version = "3.5", default-features = false, features = [
  "napi9",
  "async",
  "web_stream",
] }
napi-derive = "3.5"
tower = { version = "0.5", features = ["limit", "filter", "util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
napi-build = "2.1"
