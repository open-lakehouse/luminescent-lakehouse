[package]
name = "luminescent-migrate"
version = "0.0.0"
description = "Applies a hosted service's database migrations to a Neon branch"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "luminescent-migrate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
headwaters = { workspace = true }
opensharing-server = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
