[package]
name = "authz-neon"
version = "0.0.0"
description = "Breakwater's Cedar policy decision point (olai-pdp) as a Node-API addon, for deployment as a Neon Function"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# A deployment artifact (a `.node` inside a Neon Function zip), not a library:
# never published, never released.
publish = false

[lib]
crate-type = ["cdylib"]
# The `napi_*` symbols only resolve once Node loads the addon, so a Rust test
# binary cannot link; it is tested end to end with `node --test` instead
# (`just test authz`).
test = false
doctest = false

[dependencies]
# The PDP: olai-auth's wire API over Cedar, with entities from `authz` and
# `neon_auth` (breakwater's crates/pdp).
olai-pdp = { workspace = true }

axum = { workspace = true }
http-body-util = "0.1"
# `async` runs `#[napi] async fn`s on napi's own tokio runtime.
napi = { version = "3.5", default-features = false, features = ["napi9", "async"] }
napi-derive = "3.5"
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
napi-build = "2.1"
