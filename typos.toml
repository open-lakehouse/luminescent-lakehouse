# Spell-check configuration for `crate-ci/typos` (see .github/workflows/typos.yml).

[default]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
]

[files]
# Upstream API documents and recorded streams, checked in verbatim.
extend-exclude = ["Cargo.lock", "bun.lock", "crates/omnigent-client/fixtures/openapi-*.json", "crates/omnigent-client/fixtures/source-*.json", "crates/omnigent-client/fixtures/grant-turn.*", "apps/desktop/e2e/fixtures/*"]
