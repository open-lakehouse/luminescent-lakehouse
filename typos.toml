# Spell-check configuration for `crate-ci/typos` (see .github/workflows/typos.yml).

[default]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
]

[files]
# Upstream API documents, checked in verbatim.
extend-exclude = ["Cargo.lock", "bun.lock", "apps/desktop/crates/omnigent-client/fixtures/openapi-*.json", "apps/desktop/e2e/fixtures/*"]
