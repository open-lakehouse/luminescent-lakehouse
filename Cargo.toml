# The release unit for the deployed environments. release-plz only understands
# Cargo packages, and decides a package changed from the files `cargo package
# --list` reports, so this placeholder at the root `include`s what a deploy ships
# that no crate owns: neon.ts, the harness scripts, the web app. Cargo leaves
# nested packages (crates/*) out of it; `changelog_include` in release-plz.toml
# stands in for them, so their commits release this too. apps/desktop is a
# separate Cargo workspace with releases of its own and never counts here.
#
# Never published (`publish = false`, `git_only` in release-plz.toml). Its
# `version` is the release's: release-plz bumps it from conventional commits,
# writes CHANGELOG.md and tags `v<version>`, and deploy.yml then promotes that
# commit to production (docs/deployment.md).
[package]
name = "luminescent-lakehouse"
version = "0.0.4"
description = "Release placeholder for the deployed Neon Functions"
publish = false
# Not the repository README: a docs-only change releases nothing.
readme = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
include = [
  "Cargo.toml",
  "Cargo.lock",
  "release.rs",
  "neon.ts",
  "justfile",
  "package.json",
  "bun.lock",
  "bunfig.toml",
  "rust-toolchain.toml",
  "scripts/**",
  "apps/web/**",
]

[lib]
path = "release.rs"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/luminescent-lakehouse"
# The highest floor of the hosted services: the Unity Catalog crates (mangrove,
# and opensharing-server's) need 1.95 (headwaters needs 1.94). Keep the toolchain pin >= this.
rust-version = "1.95.0"

[workspace.dependencies]
# The deployed service versions: each Neon host and `luminescent-migrate` build
# against the same pin, so the schema a deploy migrates is the one the addon
# checks. Bump `rev` to deploy a newer upstream (see AGENTS.md).
headwaters = { git = "https://github.com/open-lakehouse/headwaters", rev = "1eee3378db72f982cfb2b6600e4c6ec41f25bc15" }
opensharing-server = { git = "https://github.com/open-lakehouse/distributary", rev = "8ffa47b38946563a087a23f969a2816fada2b9fe" }
# Unity Catalog. Held back from crates.io (shipped as an image), so a git pin;
# `default-features = false` because each host picks its features (`embed`,
# `postgres`).
unitycatalog-server = { package = "olai-uc-server", git = "https://github.com/open-lakehouse/mangrove", rev = "80f89c9052298a8c7a23e45a46bc89a4fff358a4", default-features = false }
# Grants, entity slices and the grants entity loader (open-lakehouse/trestle#377),
# unreleased: the same rev mangrove's pin uses, so both resolve one olai-auth.
# Switch to the crates.io release once it is out.
olai-auth = { version = "0.0.2", git = "https://github.com/open-lakehouse/trestle", rev = "7796402bd46a1a9c56fac6335046238db48d5e13" }

# Both hosts serve their upstream's router, so this must stay the axum major the
# services build with.
axum = "0.8"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Local dev/test builds: line tables for workspace crates, so panics and
# backtraces keep file:line, and no debug info for dependencies, which is most of
# target/. Many parallel worktrees each carry a target/, so this matters on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for a debugger: `cargo build --profile debugging`
# (builds into target/debugging/, separate from the dev artifacts).
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

# Neon Function bundles (`just build <fn>`). Neon caps the deploy zip at 10 MiB.
# Fat LTO + one codegen unit + strip keep headwaters at ~3.6 MiB while staying at
# opt-level 3 (headwaters ADR 0015). A separate profile so `release` is untouched.
[profile.release-neon]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# For bundles that don't fit at opt-level 3: the OpenSharing server is ~11 MiB
# zipped at 3 and ~7.8 MiB at "z" (aarch64-unknown-linux-gnu; distributary
# ARCHITECTURE.md, "Hosts").
[profile.release-neon-small]
inherits = "release-neon"
opt-level = "z"
