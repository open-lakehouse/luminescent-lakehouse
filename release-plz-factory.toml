# release-plz (https://release-plz.dev): releases of the factory's npm packages,
# @open-lakehouse/factory-client and @open-lakehouse/factory-ui, a stream apart
# from the environments' (release-plz.toml) and the desktop's
# (release-plz-desktop.toml), on the same Cargo workspace. On every push to main,
# factory-release.yml opens or updates the packages' release PR, which bumps
# `luminescent-factory-packages` (packages/Cargo.toml, the placeholder for both)
# and packages/CHANGELOG.md from the conventional commits that changed them.
# Merging it makes the same workflow tag `factory-v<version>`, create a draft
# GitHub Release, pack both tarballs and publish the release with them
# (docs/factory/packages.md).
#
# Nothing here is published to crates.io or npm. A package added to the
# workspace needs an entry here as well as in the other two files.
#
# Config reference: https://release-plz.dev/docs/config

[workspace]
changelog_update = true
dependencies_update = false
semver_check = false
publish = false
# `git_only` (versions from tags, not a registry) is set on the released
# package alone, as in release-plz-desktop.toml.
git_tag_enable = false
git_release_enable = false
pr_name = "chore(factory): release v{{ version }}"
pr_labels = ["release"]
# Not starting with `release-plz-` (the environments' prefix, the default):
# release-plz takes the open PR whose branch has its prefix as its own.
pr_branch_prefix = "factory-release-plz-"

[[package]]
name = "luminescent-factory-packages"
release = true
git_only = true
git_tag_enable = true
git_tag_name = "factory-v{{ version }}"
git_release_enable = true
git_release_name = "Factory packages v{{ version }}"
git_release_body = "{{ changelog }}"
# A draft until factory-release.yml has uploaded the tarballs.
git_release_draft = true
# GitHub's "latest" release is the desktop app's (its updater reads it).
git_release_latest = false
changelog_path = "packages/CHANGELOG.md"

# The rest of the workspace is the other streams'.
[[package]]
name = "luminescent-lakehouse"
release = false

[[package]]
name = "headwaters-neon"
release = false

[[package]]
name = "opensharing-neon"
release = false

[[package]]
name = "unitycatalog-neon"
release = false

[[package]]
name = "authz-neon"
release = false

[[package]]
name = "workgraph-neon"
release = false

[[package]]
name = "luminescent-migrate"
release = false

[[package]]
name = "luminescent-authz-admin"
release = false

[[package]]
name = "omnigent-client"
release = false

[[package]]
name = "plan-tree"
release = false

[[package]]
name = "factory-proto"
release = false

[[package]]
name = "factory-core"
release = false

[[package]]
name = "factory-server"
release = false

[[package]]
name = "workgraph-mcp"
release = false

[[package]]
name = "luminescent-desktop-release"
release = false

[changelog]
protect_breaking_commits = true
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc",      group = "Documentation" },
  { message = "^build",    group = "Build" },
  { message = "^test",     skip = true },
  { message = "^chore",    skip = true },
  { message = "^ci",       skip = true },
]
